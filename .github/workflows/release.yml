name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: FastFighting-DCC

      # The tests import FastFighting Core from a checkout beside this one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: galaara98/FastFighting
          path: FastFighting

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FastFighting-DCC/package-lock.json

      - name: Test
        working-directory: FastFighting-DCC
        run: |
          npm ci
          npm test

      - name: Set version and download URL in module.json
        working-directory: FastFighting-DCC
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" \
             --arg d "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/module.zip" \
             '.version = $v | .download = $d' module.json > module.tmp && mv module.tmp module.json

      # Only what Foundry loads, with the README and the license. Coders get the rest from the repository.
      - name: Build module.zip
        working-directory: FastFighting-DCC
        run: |
          zip -r module.zip module.json scripts languages hardcoded-toEN.json README.md LICENSE
          unzip -l module.zip

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            FastFighting-DCC/module.json
            FastFighting-DCC/module.zip
